<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | NELPULSE BOOKS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --text-light: #e0e0e0;
            --gold: #c5a059;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-body);
            line-height: 1.6;
        }
        header {
            background: rgba(10, 10, 10, 0.95);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
        }
        nav ul { list-style: none; display: flex; gap: 30px; }
        nav a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav a:hover, nav a.active { color: var(--gold); }
        
        .container {
            padding: 80px 5%;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #999;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }
        .form-box {
            background: #141414;
            border: 1px solid #222;
            padding: 40px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold);
            margin-bottom: 8px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-family: var(--font-body);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--gold);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">NELPULSE BOOKS</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalogue.html">Books</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Connect With Nelpulse</h1>
        <p class="subtitle">Direct communication channels for reader assistance, publication licensing, rights acquisition, or custom photo replacement support.</p>
        
        <div class="form-box">
            <form>
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" placeholder="eg. Fitness Vision" required>
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" placeholder="eg. vision@example.com" required>
                </div>
                <div class="form-group">
                    <label>Inquiry Topic</label>
                    <select>
                        <option>General Reader Inquiry</option>
                        <option>Licensing & Rights</option>
                        <option>Support & Assistance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message or Idea *</label>
                    <textarea rows="4" placeholder="How can our editorial desk assist you today?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit Inquiry</button>
            </form>
        </div>
    </div>

</body>
</html>
