<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | NELPULSE BOOKS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-light: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --gold: #b39245;
            --border-color: #e5e5e5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 6%;
    background: var(--bg-light);
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid #f0f0f0;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    flex: 1; /* Logo ko left side fix rakhega */
}

nav {
    flex: 1;
    display: flex;
    justify-content: center; /* Navigation ko hamesha exact center mein rakhega */
}

nav ul {
    display: flex;
    gap: 40px;
    list-style: none;
}

.header-right {
    flex: 1;
    display: flex;
    justify-content: flex-end; /* Search/Icons ko right side rakhega */
    align-items: center;
    gap: 20px;
}
        .logo-box {
            background: #111;
            color: var(--gold);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 14px;
        }
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #111;
            font-weight: 700;
            text-transform: uppercase;
        }
        .logo-text span { color: var(--gold); }
        nav ul { display: flex; gap: 40px; list-style: none; }
        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        nav a:hover, nav a.active { color: var(--gold); }
        
        .container {
            padding: 60px 6%;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
            color: #111;
        }
        .subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }
        .form-box {
            background: #fafafa;
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 1px solid var(--border-color);
            color: #111;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--gold);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #fff;
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 10px;
        }
        .btn-submit:hover { background: var(--gold-dark); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-area">
            <div class="logo-box">👑</div>
            <div class="logo-text">Nelpulse <span>Books</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalogue.html">Books</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Connect With Nelpulse</h1>
        <p class="subtitle">Direct communication channels for reader assistance, publication licensing, rights acquisition, or support.</p>
        
        <div class="form-box">
            <form>
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" placeholder="eg. Subhash Saini" required>
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" placeholder="eg. vision@example.com" required>
                </div>
                <div class="form-group">
                    <label>Inquiry Topic</label>
                    <select>
                        <option>General Reader Inquiry</option>
                        <option>Licensing & Rights</option>
                        <option>Support & Assistance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message or Idea *</label>
                    <textarea rows="4" placeholder="How can our editorial desk assist you today?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit Inquiry</button>
            </form>
        </div>
    </div>

</body>
</html>
